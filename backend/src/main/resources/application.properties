server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13316/harvest?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.flyway.enabled=true
server.error.include-message=never
farm.demo=${FARM_DEMO:true}
farm.zone=Asia/Shanghai
server.servlet.session.timeout=12h
